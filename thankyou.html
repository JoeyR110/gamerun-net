<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You • GameRun</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    :root { font-family: system-ui, Arial, sans-serif; color-scheme: light dark; }
    body { margin: 2rem; display:grid; place-items:center; min-height:80dvh; }
    .card { max-width:680px; background:var(--card,#111); border:1px solid #333; border-radius:14px; padding:1.5rem; text-align:center; }
    a.button { display:inline-block; margin-top:1rem; padding:.8rem 1rem; border-radius:10px; border:1px solid #2b2b2b; background:#1a1a1a; color:#fff; text-decoration:none; }
    a.button:hover { background:#232323; }
    p { color:#bdbdbd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thanks for your submission!</h1>
    <p>We received your run. After a quick rules check, approved runs appear on the Leaderboards.</p>
    <a class="button" href="/">Return Home</a>
    <a class="button" href="/leaderboards.html" style="margin-left:.5rem;">View Leaderboards</a>
  </div>
</body>
</html>
