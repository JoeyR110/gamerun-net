<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks! Submission Received</title>
  <style>
    :root { font-family: system-ui, Arial, sans-serif; color-scheme: dark; }
    body {
      background: #0a0a0a; color: #eee; margin: 0; height: 100vh;
      display: grid; place-items: center;
    }
    .card {
      background:#141414; border:1px solid #333; border-radius:14px;
      padding:24px 28px; text-align:center; max-width:720px;
    }
    h1 { color:#ff6400; margin:0 0 .5rem; }
    p { color:#bbb; margin:.25rem 0; }
    a.btn { display:inline-block; margin-top:1rem; padding:.7rem 1.1rem;
      border-radius:8px; background:#ff6400; color:#000; font-weight:700; text-decoration:none; }
    a.btn:hover { background:#ff751a; }
  </style>
  <script> setTimeout(()=>{ location.href="/"; }, 3000); </script>
</head>
<body>
  <main class="card">
    <h1>✅ Submission Received</h1>
    <p>Thanks for submitting your GameRun. Redirecting to the home page…</p>
    <a class="btn" href="/">Go now</a>
  </main>
</body>
</html>
