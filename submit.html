<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Your GameRun</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    :root {
      font-family: system-ui, Arial, sans-serif;
      color-scheme: dark;
    }
    body {
      margin: 2rem;
      background: #0a0a0a;
      color: #eaeaea;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }
    h1 {
      color: #ff6400;
      margin-bottom: 0.25rem;
    }
    p {
      color: #aaa;
      margin-bottom: 1rem;
    }
    form {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #ddd;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
      margin-bottom: 1rem;
    }
    button {
      background: #ff6400;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #ff751a;
    }
    small {
      color: #777;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Submit Your GameRun</h1>
    <p>Glitchless • Whole-game (start menu → end credits) • No load-time removal.</p>

    <form name="gamerun" method="POST" data-netlify="true" action="/thankyou.html" novalidate>
      <input type="hidden" name="form-name" value="gamerun" />
      <input type="hidden" name="run_time_hhmmss" id="runTimeHidden" />

      <label for="title">Game Title</label>
      <input id="title" name="title" type="text" required placeholder="Example: Grayhill Incident" />

      <label for="platform">Platform</label>
      <select id="platform" name="platform" required>
        <option value="">Select platform</option>
        <option>Xbox Series X|S</option>
        <option>PlayStation 5</option>
        <option>PC (Steam)</option>
        <option>PC (Epic)</option>
      </select>

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Select category</option>
        <option>Any% (Glitchless)</option>
        <option>100% Completion</option>
        <option>No Damage</option>
      </select>

      <label for="runtime">Run Time (HH:MM:SS)</label>
      <input id="runtime" name="runtime" type="text" required placeholder="00:43:35 or 0:43:35" pattern="^([0-9]?[0-9]):([0-5][0-9]):([0-5][0-9])$" />
      <small>Examples: 0:43:35 or 1:07:09</small>

      <label for="video">Video URL</label>
      <input id="video" name="video" type="url" required placeholder="https://youtube.com/..." />

      <label for="player">Player / Channel</label>
      <input id="player" name="player" type="text" required placeholder="NO CON7ROLL" />

      <label for="date">Run Date</label>
      <input id="date" name="date" type="date" required />

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" name="notes" rows="3" placeholder="Any notes or version info..."></textarea>

      <div>
        <label>
          <input type="checkbox" required />
          I followed GameRun rules (glitchless, whole-game, no load-time removal).
        </label>
      </div>

      <button type="submit">Submit GameRun</button>
    </form>
  </div>

  <script>
    const runtimeInput = document.getElementById("runtime");
    const hiddenTime = document.getElementById("runTimeHidden");

    runtimeInput.addEventListener("input", () => {
      const value = runtimeInput.value.trim();
      const match = value.match(/^(\d?\d):([0-5]\d):([0-5]\d)$/);
      if (match) {
        hiddenTime.value = match[0];
        runtimeInput.setCustomValidity("");
      } else {
        runtimeInput.setCustomValidity("Please enter a valid time in HH:MM:SS format.");
      }
    });
  </script>
</body>
</html>
